<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
  </head>
  <body>
    <main>
      <h1 class="heading">Expense Tracker</h1>
      <section class="Transaction">
        <div class="summary-section">
          <div class="total-balance">
            Total Balance: <span id="balance">0.00</span>
          </div>
          <div class="total-income">
            Total Income: <span id="income">0.00</span>
          </div>
          <div class="total-expense">
            Total Expense: <span id="expense">0.00</span>
          </div>
        </div>
        <form id="transaction-form">
          <input
            type="text"
            id="transaction-name"
            placeholder="Transaction Name (e.g., Salary, Groceries)"
          />
          <input type="number" id="transaction-amount" placeholder="Amount" />
          <select id="transaction-type">
            <option value="Income">Income</option>
            <option value="Expense">Expense</option>
          </select>
          <select id="transaction-category">
            <option value="Food">Food</option>
            <option value="Transportation">Transportation</option>
            <option value="Entertainment">Entertainment</option>    
            <option value="Utilities">Utilities</option>
            <option value="Other">Other</option>
          </select>
          <div class="date">
            <input type="date" id="transaction-date" />
          </div>
          <button id="add-transaction">Add Transaction</button>
        </form>
      </section>
      <section class="Recent-Transactions">
        <h2>Recent Transactions</h2>
        <ul id="transaction-list"></ul>
      </section>
      <section class="Chart">
        <h2>Expense Distribution</h2>
        <canvas id="expense-chart"></canvas>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
  </body>
</html>
